<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#ffffff; --fg:#222; --link:#b8b8b8; --node:#f2f4f7; --stroke:#8a94a3; --bar:#eee; --accent:#2f6fde; --hover:#dfe6f3; }
  :root.dark { --bg:#2b2d30; --fg:#dfe1e5; --link:#555a60; --node:#393b40; --stroke:#6f737a; --bar:#1e1f22; --accent:#4f9cf5; --hover:#2e436e; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font:12px -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  #bar { min-height:30px; box-sizing:border-box; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:3px 8px; background:var(--bar); }
  #bar button { font:inherit; color:inherit; background:var(--node); border:1px solid var(--stroke);
                border-radius:4px; padding:3px 5px; cursor:pointer; display:inline-flex; align-items:center; gap:4px; position:relative; }
  #bar button svg { width:14px; height:14px; cursor:inherit; fill:none; stroke:currentColor; stroke-width:1.5;
                    stroke-linecap:round; stroke-linejoin:round; }
  /* CSS tooltip: native title tooltips are not reliable in every JCEF rendering mode */
  #bar button:hover::after { content:attr(data-tip); position:absolute; top:calc(100% + 4px); left:0; z-index:10;
                             padding:2px 6px; border:1px solid var(--stroke); border-radius:4px; white-space:nowrap;
                             background:var(--bar); color:var(--fg); pointer-events:none; }
  #bar button.has-conflicts { color:#e5534b; border-color:#e5534b; }
  #count { opacity:.75; }
  #bar input { font:inherit; color:inherit; background:var(--node); border:1px solid var(--stroke);
               border-radius:4px; padding:2px 6px; width:180px; }
  .legend span { margin-left:10px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }

  #crumbs { flex:none; height:24px; box-sizing:border-box; display:flex; align-items:center; gap:2px; padding:0 8px; white-space:nowrap;
            overflow-x:auto; overflow-y:hidden; border-bottom:1px solid var(--stroke); }
  #crumbs::-webkit-scrollbar { height:4px; }
  #crumbs::-webkit-scrollbar-thumb { background:var(--stroke); }
  #crumbs .hint { opacity:.65; }
  #crumbs .sep { opacity:.55; padding:0 2px; }
  .crumb { font:inherit; color:inherit; background:none; border:none; border-radius:3px; padding:1px 4px; cursor:pointer; }
  .crumb:hover { background:var(--hover); }
  .crumb.current { font-weight:bold; color:var(--accent); }

  #main { flex:1; min-height:0; display:flex; }
  #svg { flex:1; min-width:0; height:100%; cursor:grab; }
  #svg.drag { cursor:grabbing; }
  .link { fill:none; stroke:var(--link); stroke-width:1.2; }
  .link.path { stroke:var(--accent); stroke-width:2.4; }
  .node rect { fill:var(--node); stroke:var(--stroke); stroke-width:1.2; rx:5; }
  .node { cursor:pointer; }
  .node:hover rect { stroke-width:2.2; }
  .node text { fill:var(--fg); pointer-events:none; }
  /* !important: scope/conflict colours set the border inline, and these states must win over them */
  .node.match .box { fill:#ffd866; stroke:#f5a623 !important; stroke-width:2.6; }
  .node.match > text { fill:#222; }
  .node.selected .box { stroke:var(--accent) !important; stroke-width:2.8; }
  .toggle circle { fill:var(--bg); stroke:var(--stroke); }
  .toggle text { fill:var(--fg); font-weight:bold; text-anchor:middle; }

  #panel { flex:none; width:340px; overflow:auto; border-left:1px solid var(--stroke); background:var(--bg); }
  #panel[hidden] { display:none; }
  #panel-head { position:sticky; top:0; display:flex; justify-content:space-between; align-items:center; padding:6px 8px;
                background:var(--bar); font-weight:bold; }
  #panel-close { font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0 4px; }
  .empty { padding:12px 8px; opacity:.75; }
  .cgroup { padding:6px 8px; border-bottom:1px solid var(--link); }
  .cname { font-weight:bold; margin-bottom:3px; overflow-wrap:anywhere; }
  .crow { padding:3px 4px; border-radius:3px; cursor:pointer; }
  .crow:hover { background:var(--hover); }
  .crow.static { cursor:default; }
  .crow.static:hover { background:none; }
  .used { color:#3fb950; font-weight:bold; }
  .omitted { color:#e5534b; font-weight:bold; }
  .cpath { opacity:.8; overflow-wrap:anywhere; }

  #menu { position:fixed; z-index:20; min-width:190px; padding:4px; background:var(--bar); border:1px solid var(--stroke); border-radius:6px; }
  #menu[hidden] { display:none; }
  #menu button { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none; border:none; border-radius:4px; padding:4px 8px; cursor:pointer; }
  #menu button:hover { background:var(--hover); }
  #menu hr { border:none; border-top:1px solid var(--stroke); margin:4px 2px; }
  #toast { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:30; padding:5px 12px; border-radius:5px;
           background:var(--bar); border:1px solid var(--stroke); pointer-events:none; }
  #toast[hidden] { display:none; }
</style>
</head>
<body>
<div id="bar">
  <button id="reload" data-tip="Reload from POM" aria-label="Reload from POM"><svg viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1L13.5 5.7M13.5 2.2v3.5H10"/></svg></button>
  <button id="expand" data-tip="Expand all" aria-label="Expand all"><svg viewBox="0 0 16 16"><path d="M6 3L1.5 8 6 13M10 3l4.5 5-4.5 5"/></svg></button>
  <button id="collapse" data-tip="Collapse all" aria-label="Collapse all"><svg viewBox="0 0 16 16"><path d="M2 3l4.5 5L2 13M14 3L9.5 8l4.5 5"/></svg></button>
  <span id="count"></span>
  <button id="fit" data-tip="Fit to window" aria-label="Fit to window"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/><circle cx="8" cy="8" r="1.5"/></svg></button>
  <button id="copy" data-tip="Copy as text" aria-label="Copy as text"><svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.5"/><path d="M10.5 5.5V3.5A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5h2"/></svg></button>
  <button id="export" data-tip="Export as image" aria-label="Export as image"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="5.5" cy="6.5" r="1"/><path d="M2.5 12l3.5-3.5 2.5 2.5 2-2 3 3"/></svg></button>
  <button id="conflicts" data-tip="Show version conflicts" aria-label="Show version conflicts"><svg viewBox="0 0 16 16"><path d="M8 2l6.5 11.5h-13zM8 6.5v3.5M8 12v.01"/></svg><span id="conflict-count"></span></button>
  <input id="search" placeholder="Search (Enter)">
  <span class="legend">
    <span><i class="dot" style="background:#e5534b"></i>conflict</span>
    <span><i class="dot" style="background:#9aa0a6"></i>duplicate/omitted</span>
    <span><i class="dot" style="background:#3fb950"></i>test</span>
    <span><i class="dot" style="background:#d29922"></i>provided/runtime</span>
  </span>
</div>
<div id="crumbs"></div>
<div id="main">
  <svg id="svg"><g id="root"></g></svg>
  <aside id="panel" hidden>
    <div id="panel-head"><span id="panel-title"></span><button id="panel-close" aria-label="Close conflicts panel">&#10005;</button></div>
    <div id="panel-body"></div>
  </aside>
</div>
<div id="menu" hidden></div>
<div id="toast" hidden></div>

<script>
  /*NAV*/
  const DARK = /*DARK*/false;
  const DATA = /*DATA*/null;
  if (DARK) document.documentElement.classList.add('dark');

  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const NW = 270, NH = 26, GX = 320, GY = 36;
  const svg = $('svg'), g = $('root');
  let tx = 20, ty = 20, k = 1, uid = 0, matches = new Set(), searching = false;
  let selected = null, pathIds = new Set();

  const DEFAULT_DEPTH = 2;      // levels shown initially (1 = direct dependencies only)
  let total = 0;

  function init(n, d, parent) {
    n.id = ++uid; n.depth = d; n.open = d < DEFAULT_DEPTH; n.parent = parent;
    total++;
    n.children.forEach(c => init(c, d + 1, n));
  }
  init(DATA, 0, null);

  function applyTransform() { g.setAttribute('transform', `translate(${tx},${ty}) scale(${k})`); }

  function setDepth(d) {
    (function walk(n) { n.open = n.depth < d; n.children.forEach(walk); })(DATA);
    render();
    fit();
  }

  function layout() {
    let leaf = 0;
    (function walk(n) {
      const kids = n.open ? n.children : [];
      if (!kids.length) n.y = leaf++ * GY;
      else { kids.forEach(walk); n.y = (kids[0].y + kids[kids.length - 1].y) / 2; }
      n.x = n.depth * GX;
    })(DATA);
  }

  // Zooms so every visible node fits, but never enlarges past 100%
  let fitPending = false;
  function fit() {
    const r = svg.getBoundingClientRect();
    if (!r.width || !r.height) { fitPending = true; return; }
    fitPending = false;
    let minY = Infinity, maxY = -Infinity, maxX = 0;
    (function walk(n) {
      minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y); maxX = Math.max(maxX, n.x);
      if (n.open) n.children.forEach(walk);
    })(DATA);
    const w = maxX + NW + 16, h = maxY - minY + NH;
    k = Math.max(0.02, Math.min(1, (r.width - 40) / w, (r.height - 40) / h));
    tx = (r.width - w * k) / 2;
    ty = (r.height - h * k) / 2 - minY * k;
    applyTransform();
  }
  new ResizeObserver(() => { if (fitPending) fit(); }).observe(svg);

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) e.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function fill(n) {
    if (n.state === 'CONFLICT') return '#e5534b';
    if (n.state === 'DUPLICATE' || n.state === 'EXCLUDED') return '#9aa0a6';
    if (n.scope === 'test') return '#3fb950';
    if (n.scope === 'provided' || n.scope === 'runtime') return '#d29922';
    return null;
  }

  function linkPath(x1, y1, x2, y2) {
    const mx = (x1 + x2) / 2;
    return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
  }

  function render() {
    layout();
    applyTransform();
    g.textContent = '';
    let visible = 0;
    const linkLayer = el('g', {}, g), nodeLayer = el('g', {}, g);
    (function draw(n) {
      if (n.open) n.children.forEach(c => {
        const onPath = pathIds.has(n.id) && pathIds.has(c.id);
        el('path', { class: 'link' + (onPath ? ' path' : ''), d: linkPath(n.x + NW, n.y + NH / 2, c.x, c.y + NH / 2) }, linkLayer);
        draw(c);
      });
      drawNode(n, nodeLayer);
      visible++;
    })(DATA);
    $('count').textContent = `${visible} of ${total} nodes shown` +
      (searching ? `, ${matches.size} ${matches.size === 1 ? 'match' : 'matches'}` : '');
  }

  function shortLabel(name) { return name.length > 40 ? name.slice(0, 39) + '…' : name; }

  function drawNode(n, layer) {
    const grp = el('g', { class: 'node' + (matches.has(n.id) ? ' match' : '') + (selected === n ? ' selected' : ''),
                          transform: `translate(${n.x},${n.y})` }, layer);
    const rect = el('rect', { class: 'box', width: NW, height: NH }, grp);
    const f = fill(n);
    if (f) { rect.style.stroke = f; el('rect', { width: 5, height: NH, rx: 2, style: `fill:${f};stroke:none` }, grp); }
    if (n.state === 'EXCLUDED' || n.state === 'DUPLICATE') rect.setAttribute('stroke-dasharray', '4 3');

    const t = el('text', { x: 12, y: NH / 2 + 4 }, grp);
    t.textContent = shortLabel(n.name);

    const tip = el('title', {}, grp);
    tip.textContent = n.nav
      ? `${n.name}\nscope: ${n.scope}   state: ${n.state}\n` +
        (n.transitive ? `transitive – click opens the POM of ${n.by} that declares it` : 'click to open in POM')
      : n.name;

    grp.addEventListener('click', () => { if (!moved) selectNode(n, true); });

    if (n.children.length) {
      const tg = el('g', { class: 'toggle', transform: `translate(${NW + 0},${NH / 2})` }, grp);
      el('circle', { r: 8 }, tg);
      const s = el('text', { y: 4 }, tg);
      s.textContent = n.open ? '–' : '+' ;
      tg.addEventListener('click', ev => { ev.stopPropagation(); if (moved) return; n.open = !n.open; render(); });
    }
  }

  // ---- selection and the path bar ----

  function pathTo(n) {
    const path = [];
    for (let p = n; p; p = p.parent) path.unshift(p);
    return path;
  }

  // Opens the node's branch, highlights its path and brings it into view; navigate also opens its POM declaration
  function selectNode(n, navigate) {
    const path = pathTo(n);
    path.slice(0, -1).forEach(p => p.open = true);
    selected = n;
    pathIds = new Set(path.map(p => p.id));
    render();
    reveal(n);
    renderCrumbs();
    if (navigate && n.nav) window.nav(n.nav);
  }

  function artifactLabel(n) { return n === DATA ? n.name : n.name.split(':').slice(1).join(':'); }

  function renderCrumbs() {
    const bar = $('crumbs');
    bar.textContent = '';
    if (!selected) {
      const hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = (DATA.context ? DATA.context + '. ' : '') + 'Click a dependency to see its path';
      bar.appendChild(hint);
      return;
    }
    pathTo(selected).forEach((n, i) => {
      if (i) {
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '›';
        bar.appendChild(sep);
      }
      const b = document.createElement('button');
      b.className = 'crumb' + (n === selected ? ' current' : '');
      b.textContent = artifactLabel(n);
      b.title = n.name;
      b.onclick = () => selectNode(n, true);
      bar.appendChild(b);
    });
    bar.scrollLeft = bar.scrollWidth;
  }

  // ---- version conflicts ----

  function collectConflicts() {
    const groups = new Map(), used = new Map();
    (function walk(n) {
      if (n.state === 'CONFLICT') {
        if (!groups.has(n.ga)) groups.set(n.ga, []);
        groups.get(n.ga).push(n);
      } else if (n.state === 'ADDED' && n.ga && !used.has(n.ga)) {
        used.set(n.ga, n);
      }
      n.children.forEach(walk);
    })(DATA);
    return [...groups].map(([ga, omitted]) => ({ ga, omitted, used: used.get(ga) || null }));
  }

  function textRow(parent, cls, text) {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = text;
    parent.appendChild(d);
    return d;
  }

  function origin(n, verb) {
    const chain = pathTo(n).slice(1, -1).map(p => p.name.split(':')[1]);
    return chain.length ? `${verb} ${chain.join(' › ')}` : 'declared directly in this POM';
  }

  function conflictRow(parent, cls, heading, detail, node) {
    const row = textRow(parent, 'crow' + (node ? '' : ' static'), '');
    textRow(row, cls, heading);
    if (detail) textRow(row, 'cpath', detail);
    if (node) row.onclick = () => selectNode(node, false);
  }

  const conflictGroups = collectConflicts();

  function renderConflicts() {
    const body = $('panel-body');
    body.textContent = '';
    $('panel-title').textContent = `Version conflicts (${conflictGroups.length})`;
    if (!conflictGroups.length) { textRow(body, 'empty', 'No version conflicts found.'); return; }
    conflictGroups.forEach(c => {
      const group = textRow(body, 'cgroup', '');
      textRow(group, 'cname', c.ga);
      const usedVersion = c.used ? c.used.ver : c.omitted[0].related;
      if (usedVersion) {
        let detail = c.used ? origin(c.used, 'via') : 'chosen by Maven';
        if (c.used && c.used.managedFrom) detail += ` (managed, was ${c.used.managedFrom})`;
        conflictRow(group, 'used', `${usedVersion}  used`, detail, c.used);
      }
      c.omitted.forEach(n => conflictRow(group, 'omitted', `${n.ver}  omitted`, origin(n, 'requested by'), n));
    });
  }

  $('conflict-count').textContent = String(conflictGroups.length);
  if (conflictGroups.length) $('conflicts').classList.add('has-conflicts');
  $('conflicts').onclick = () => { $('panel').hidden = !$('panel').hidden; if (!$('panel').hidden) renderConflicts(); };
  $('panel-close').onclick = () => { $('panel').hidden = true; };

  // ---- copy as text and export as image ----

  function kidsFor(n, whole) { return whole || n.open ? n.children : []; }

  function textLabel(n) {
    let s = n.name;
    if (n.scope && n.scope !== 'root' && n.scope !== 'null') s += ` (${n.scope})`;
    if (n.state === 'CONFLICT') s += n.related ? ` - omitted for conflict with ${n.related}` : ' - omitted for conflict';
    else if (n.state === 'DUPLICATE') s += ' - omitted for duplicate';
    else if (n.state === 'EXCLUDED') s += ' - excluded';
    else if (n.state === 'CYCLE') s += ' - omitted for cycle';
    return s;
  }

  function treeText(whole) {
    const lines = [textLabel(DATA)];
    (function walk(n, prefix) {
      const kids = kidsFor(n, whole);
      kids.forEach((c, i) => {
        const last = i === kids.length - 1;
        lines.push(prefix + (last ? '\\- ' : '+- ') + textLabel(c));
        walk(c, prefix + (last ? '   ' : '|  '));
      });
    })(DATA, '');
    return lines;
  }

  const CHUNK = 256 * 1024;
  function sendToIde(kind, data) {
    window.host('B' + kind);
    for (let i = 0; i < data.length; i += CHUNK) window.host('C' + data.slice(i, i + CHUNK));
    window.host('E');
  }

  function copyText(whole) {
    const lines = treeText(whole);
    sendToIde('text', lines.join('\n'));
    toast(`Copied ${lines.length} ${whole ? 'lines (whole tree)' : 'lines (visible tree)'}`);
  }

  function escapeXml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // Drawn from the data with explicit colours, because a standalone image can't use this page's stylesheet
  function treeSvg(whole) {
    const c = DARK ? { bg: '#2b2d30', fg: '#dfe1e5', link: '#555a60', node: '#393b40', stroke: '#6f737a' }
                   : { bg: '#ffffff', fg: '#222222', link: '#b8b8b8', node: '#f2f4f7', stroke: '#8a94a3' };
    const pos = new Map();
    let leaf = 0, maxX = 0;
    (function walk(n) {
      const kids = kidsFor(n, whole);
      let y;
      if (!kids.length) y = leaf++ * GY;
      else { kids.forEach(walk); y = (pos.get(kids[0].id).y + pos.get(kids[kids.length - 1].id).y) / 2; }
      pos.set(n.id, { x: n.depth * GX, y });
      maxX = Math.max(maxX, n.depth * GX);
    })(DATA);

    const M = 20, W = maxX + NW + 2 * M, H = Math.max(leaf, 1) * GY - (GY - NH) + 2 * M;
    const out = [`<svg xmlns="${NS}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Segoe UI, sans-serif" font-size="12">`,
                 `<rect width="${W}" height="${H}" fill="${c.bg}"/><g transform="translate(${M},${M})">`];
    (function links(n) {
      const a = pos.get(n.id);
      kidsFor(n, whole).forEach(k2 => {
        const b = pos.get(k2.id);
        out.push(`<path d="${linkPath(a.x + NW, a.y + NH / 2, b.x, b.y + NH / 2)}" fill="none" stroke="${c.link}" stroke-width="1.2"/>`);
        links(k2);
      });
    })(DATA);
    (function nodes(n) {
      const p = pos.get(n.id), f = fill(n);
      const dash = n.state === 'EXCLUDED' || n.state === 'DUPLICATE' ? ' stroke-dasharray="4 3"' : '';
      out.push(`<g transform="translate(${p.x},${p.y})"><rect width="${NW}" height="${NH}" rx="5" fill="${c.node}" stroke="${f || c.stroke}" stroke-width="1.2"${dash}/>`);
      if (f) out.push(`<rect width="5" height="${NH}" rx="2" fill="${f}"/>`);
      out.push(`<text x="12" y="${NH / 2 + 4}" fill="${c.fg}">${escapeXml(shortLabel(n.name))}</text></g>`);
      kidsFor(n, whole).forEach(nodes);
    })(DATA);
    out.push('</g></svg>');
    return { text: out.join(''), W, H };
  }

  const MAX_IMAGE_SIDE = 8000;   // canvases fail silently when they get much larger
  function exportImage(whole) {
    const s = treeSvg(whole);
    const scale = Math.min(2, MAX_IMAGE_SIDE / Math.max(s.W, s.H));
    const img = new Image();
    img.onerror = () => toast('Could not create the image');
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(s.W * scale);
      canvas.height = Math.ceil(s.H * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      sendToIde('image', canvas.toDataURL('image/png').split(',')[1]);
      if (scale < 1) toast('This graph is very large, so the image was scaled down to fit');
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.text);
  }

  let toastTimer = 0;
  function toast(text, untilReplaced) {
    $('toast').textContent = text;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    if (!untilReplaced) toastTimer = setTimeout(() => { $('toast').hidden = true; }, 2500);
  }

  // ---- menus ----

  function showMenu(x, y, items) {
    const m = $('menu');
    m.textContent = '';
    items.forEach(it => {
      if (!it) { m.appendChild(document.createElement('hr')); return; }
      const b = document.createElement('button');
      b.textContent = it.label;
      b.onclick = () => { m.hidden = true; it.run(); };
      m.appendChild(b);
    });
    m.hidden = false;
    m.style.left = Math.min(x, window.innerWidth - m.offsetWidth - 4) + 'px';
    m.style.top = Math.min(y, window.innerHeight - m.offsetHeight - 4) + 'px';
  }

  function menuBelow(button, items) {
    const r = button.getBoundingClientRect();
    showMenu(r.left, r.bottom + 2, items);
  }

  const copyItems = [{ label: 'Whole tree', run: () => copyText(true) }, { label: 'Visible tree', run: () => copyText(false) }];
  const exportItems = [{ label: 'Whole tree', run: () => exportImage(true) }, { label: 'Visible tree', run: () => exportImage(false) }];
  $('copy').onclick = () => menuBelow($('copy'), copyItems);
  $('export').onclick = () => menuBelow($('export'), exportItems);

  svg.addEventListener('contextmenu', e => {
    e.preventDefault();
    showMenu(e.clientX, e.clientY, [
      { label: 'Copy whole tree as text', run: () => copyText(true) },
      { label: 'Copy visible tree as text', run: () => copyText(false) },
      null,
      { label: 'Export whole tree as image', run: () => exportImage(true) },
      { label: 'Export visible tree as image', run: () => exportImage(false) }
    ]);
  });
  window.addEventListener('mousedown', e => { if (!$('menu').contains(e.target)) $('menu').hidden = true; }, true);
  window.addEventListener('keydown', e => { if (e.key === 'Escape') $('menu').hidden = true; });

  // ---- toolbar ----

  // The IDE syncs Maven, then replaces this page with the new tree
  $('reload').onclick = () => { toast('Reloading from the POM…', true); window.host('R'); };
  $('expand').onclick = () => setDepth(Infinity);
  $('collapse').onclick = () => setDepth(1);
  $('fit').onclick = () => { render(); fit(); };

  $('search').addEventListener('keydown', ev => {
    if (ev.key !== 'Enter') return;
    const q = ev.target.value.trim().toLowerCase();
    matches = new Set();
    searching = q !== '';
    let first = null;
    if (q) (function walk(n, path) {
      const hit = n.name.toLowerCase().includes(q);
      if (hit) { first = first || n; matches.add(n.id); path.forEach(p => p.open = true); }
      n.children.forEach(c => walk(c, path.concat(n)));
    })(DATA, []);
    render();
    if (first) reveal(first);
  });

  // Pans to a node only if it is off-screen, so a match is never highlighted out of sight
  function reveal(n) {
    const r = svg.getBoundingClientRect(), x = n.x * k + tx, y = n.y * k + ty;
    if (x >= 0 && y >= 0 && x + NW * k <= r.width && y + NH * k <= r.height) return;
    tx = r.width / 2 - (n.x + NW / 2) * k;
    ty = r.height / 2 - (n.y + NH / 2) * k;
    applyTransform();
  }

  // pan & zoom
  let moved = false, dragging = false, sx = 0, sy = 0;
  svg.addEventListener('mousedown', e => { if (e.button !== 0) return; dragging = true; moved = false; sx = e.clientX; sy = e.clientY; });
  window.addEventListener('mouseup', () => { dragging = false; svg.classList.remove('drag'); setTimeout(() => moved = false, 0); });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; svg.classList.add('drag'); }
    if (moved) { tx += dx; ty += dy; sx = e.clientX; sy = e.clientY; applyTransform(); }
  });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const nk = Math.min(3, Math.max(0.02, k * (e.deltaY < 0 ? 1.1 : 0.9)));
    tx = px - (px - tx) * nk / k; ty = py - (py - ty) * nk / k; k = nk;
    applyTransform();
  }, { passive: false });

  render();
  fit();
  renderCrumbs();
</script>
</body>
</html>
